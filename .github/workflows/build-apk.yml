name: Build CCompiler Pro APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fetch bundled fonts (bundled into the APK, no runtime download)
      run: bash scripts/fetch_fonts.sh

    - name: Build C compiler (TinyCC for Android arm64, via NDK)
      run: bash scripts/build_tcc.sh

    - name: Restore release signing key from secrets
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::Secret KEYSTORE_BASE64 is missing. Create the signing key first (see instructions)."
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

    - name: Set up Gradle 8.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Build signed release APK
      env:
        KEYSTORE_FILE: ${{ runner.temp }}/release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: gradle assembleRelease --no-daemon

    - name: Trust report and guards (fails on any permission, tracker SDK or debuggable flag)
      run: |
        APK=app/build/outputs/apk/release/app-release.apk
        ls -l "$APK"
        mkdir -p trust-out
        cp "$APK" trust-out/CCompilerPro.apk
        bash scripts/trust_report.sh trust-out/CCompilerPro.apk trust-out
        (cd trust-out && sha256sum CCompilerPro.apk > CCompilerPro.apk.sha256 && cat CCompilerPro.apk.sha256)

    - name: Show signing certificate fingerprint
      run: |
        SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        AS="$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -1)"
        "$AS" verify --print-certs trust-out/CCompilerPro.apk | tee trust-out/SIGNING_CERT.txt

    - name: Upload APK + trust report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ccompiler-pro-release
        path: trust-out/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5

    - name: Download the built files
      uses: actions/download-artifact@v4
      with:
        name: ccompiler-pro-release
        path: release-files

    - name: Check that the tag matches the app version
      run: |
        VN="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
        TAG="${GITHUB_REF_NAME#v}"
        echo "tag=$TAG  versionName=$VN"
        if [ "$VN" != "$TAG" ]; then
          echo "::error::Tag v$TAG does not match versionName $VN in app/build.gradle.kts"
          exit 1
        fi

    - name: Create the GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          release-files/CCompilerPro.apk \
          release-files/CCompilerPro.apk.sha256 \
          release-files/TRUST_REPORT.md \
          release-files/SIGNING_CERT.txt \
          --verify-tag --title "CCompiler Pro ${GITHUB_REF_NAME#v}" --generate-notes
